# Include this inside the HTTPS VirtualHost for glitchahitch.com.
# The Node service remains private on 127.0.0.1:3000; Apache provides HTTPS.
ProxyPreserveHost On
RedirectMatch 302 ^/whatsapp$ /whatsapp/
ProxyPass        /whatsapp/  http://127.0.0.1:3000/
ProxyPassReverse /whatsapp/  http://127.0.0.1:3000/

<Location /whatsapp/>
    AuthType Basic
    AuthName "WhatsApp Bridge"
    AuthUserFile /etc/apache2/.htpasswd-whatsapp
    Require valid-user
</Location>
